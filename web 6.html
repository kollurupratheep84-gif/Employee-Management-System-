```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
        }

        header {
            background: #1f4e78;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .form-box h2 {
            margin-bottom: 20px;
            color: #1f4e78;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background: #1f4e78;
            color: white;
            margin-top: 15px;
        }

        .add-btn:hover {
            background: #163a5a;
        }

        .search-box {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1f4e78;
            color: white;
        }

        .edit-btn {
            background: #f0ad4e;
            color: white;
        }

        .delete-btn {
            background: #d9534f;
            color: white;
        }

        .edit-btn:hover {
            background: #ec971f;
        }

        .delete-btn:hover {
            background: #c9302c;
        }

        @media(max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Management System</h1>
    <p>Manage Employee Records</p>
</header>

<div class="container">

    <!-- Employee Form -->
    <div class="form-box">
        <h2>Add Employee</h2>

        <div class="form-grid">
            <input type="text" id="empId" placeholder="Employee ID">
            <input type="text" id="name" placeholder="Employee Name">
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="phone" placeholder="Phone Number">

            <select id="department">
                <option value="">Select Department</option>
                <option>IT</option>
                <option>HR</option>
                <option>Finance</option>
                <option>Marketing</option>
                <option>Sales</option>
            </select>

            <input type="number" id="salary" placeholder="Salary">
        </div>

        <button class="add-btn" onclick="addEmployee()">Add Employee</button>
    </div>

    <!-- Search -->
    <input
        type="text"
        id="search"
        class="search-box"
        placeholder="Search employee by name or department..."
        onkeyup="displayEmployees()"
    >

    <!-- Employee Table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="employeeTable">
        </tbody>
    </table>

</div>

<script>

    let employees = JSON.parse(localStorage.getItem("employees")) || [];

    let editIndex = -1;

    function addEmployee() {

        let empId = document.getElementById("empId").value.trim();
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let department = document.getElementById("department").value;
        let salary = document.getElementById("salary").value;

        if (
            empId === "" ||
            name === "" ||
            email === "" ||
            phone === "" ||
            department === "" ||
            salary === ""
        ) {
            alert("Please fill all fields.");
            return;
        }

        let employee = {
            empId: empId,
            name: name,
            email: email,
            phone: phone,
            department: department,
            salary: salary
        };

        if (editIndex === -1) {
            employees.push(employee);
            alert("Employee added successfully!");
        } else {
            employees[editIndex] = employee;
            alert("Employee updated successfully!");
            editIndex = -1;
        }

        localStorage.setItem("employees", JSON.stringify(employees));

        clearForm();
        displayEmployees();
    }

    function displayEmployees() {

        let table = document.getElementById("employeeTable");
        let search = document.getElementById("search").value.toLowerCase();

        table.innerHTML = "";

        employees.forEach((employee, index) => {

            if (
                employee.name.toLowerCase().includes(search) ||
                employee.department.toLowerCase().includes(search)
            ) {

                let row = `
                    <tr>
                        <td>${employee.empId}</td>
                        <td>${employee.name}</td>
                        <td>${employee.email}</td>
                        <td>${employee.phone}</td>
                        <td>${employee.department}</td>
                        <td>₹${employee.salary}</td>

                        <td>
                            <button class="edit-btn"
                                onclick="editEmployee(${index})">
                                Edit
                            </button>

                            <button class="delete-btn"
                                onclick="deleteEmployee(${index})">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;

                table.innerHTML += row;
            }
        });
    }

    function editEmployee(index) {

        let employee = employees[index];

        document.getElementById("empId").value = employee.empId;
        document.getElementById("name").value = employee.name;
        document.getElementById("email").value = employee.email;
        document.getElementById("phone").value = employee.phone;
        document.getElementById("department").value = employee.department;
        document.getElementById("salary").value = employee.salary;

        editIndex = index;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    function deleteEmployee(index) {

        if (confirm("Are you sure you want to delete this employee?")) {

            employees.splice(index, 1);

            localStorage.setItem(
                "employees",
                JSON.stringify(employees)
            );

            displayEmployees();
        }
    }

    function clearForm() {

        document.getElementById("empId").value = "";
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("department").value = "";
        document.getElementById("salary").value = "";
    }

    displayEmployees();

</script>

</body>
</html>
